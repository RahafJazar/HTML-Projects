<body>
    <script>
        function pow(base, exponent) {
            if (exponent < 0 || exponent != Math.round(exponent)) {
                return NaN;
            }
            let result = 1;
            for (let i = 0; i < exponent; i++) {
                result *= base;
            }
            return result;
        }
    </script>
